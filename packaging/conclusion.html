<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Khmer OS Battambang", "Khmer OS", sans-serif;
            font-size: 13px;
            color: #333333;
            line-height: 1.6;
            margin: 20px;
        }
        h1 {
            font-size: 18px;
            color: #107C41;
            margin-bottom: 10px;
        }
        p {
            margin-bottom: 10px;
        }
        .box {
            background-color: #F3F9F1;
            border-left: 4px solid #107C41;
            padding: 10px 14px;
            border-radius: 4px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>🎉 ការដំឡើងបានជោគជ័យជាស្ថាពរ!</h1>
    <p>កម្មវិធី <strong>Office Extension &amp; Ribbon Manager</strong> ត្រូវបានដំឡើងចូលទៅកាន់ថត <code>/Applications</code> រួចរាល់ហើយ។</p>
    
    <div class="box">
        <strong>របៀបចាប់ផ្តើមប្រើប្រាស់:</strong>
        <p>លោកអ្នកអាចបើក <strong>Finder &rarr; Applications &rarr; Office Extension &amp; Ribbon Manager</strong> ឬស្វែងរកតាមរយៈ <strong>Spotlight (Cmd + Space)</strong> ដើម្បីដំណើរការកម្មវិធីភ្លាមៗ។</p>
    </div>
</body>
</html>
